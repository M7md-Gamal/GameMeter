# Codemagic CI/CD for GameMeter
# Builds an unsigned iOS SIMULATOR app (.app zipped) ready to drag into appetize.io
#
# One-time setup in Codemagic UI:
#   1. Add the repo (YAML recognition on).
#   2. Create an environment variable group named `gamemeter_credentials`
#      containing RAWG_API_KEY (marked secure).
#   3. Run the `ios-simulator` workflow, download GameMeter-simulator.zip
#      from the build artifacts page, upload it to appetize.io.

workflows:
  ios-simulator:
    name: GameMeter iOS Simulator (Appetize)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
    environment:
      xcode: latest
      groups:
        - gamemeter_credentials
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
    scripts:
      - name: Inject RAWG API key
        script: |
          set -e
          if [ -z "$RAWG_API_KEY" ]; then
            echo "WARNING: RAWG_API_KEY env var is empty - API calls will fail at runtime"
          fi
          sed -i '' "s/^RAWG_API_KEY=.*/RAWG_API_KEY=$RAWG_API_KEY/" iosApp/Config.xcconfig

      - name: Prepare Java & Android SDK
        script: |
          set -e
          chmod +x gradlew
          # Resolve a JDK 21 (fallback 17, fallback image default) for AGP 9
          export JAVA_HOME="$(/usr/libexec/java_home -v 21 2>/dev/null \
            || /usr/libexec/java_home -v 17 2>/dev/null \
            || /usr/libexec/java_home)"
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          ./gradlew --version

      - name: Build Kotlin framework (simulator)
        script: |
          set -e
          # Pre-build the simulator framework in a dedicated step so any Gradle
          # failure is visible here with a clean log. The Xcode script phase
          # will reuse the cached build.
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS simulator app (unsigned)
        script: |
          set -e
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Zip .app for Appetize
        script: |
          set -e
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -qr "$CM_BUILD_DIR/GameMeter-simulator.zip" GameMeter.app
          ls -lh "$CM_BUILD_DIR/GameMeter-simulator.zip"
    artifacts:
      - GameMeter-simulator.zip
